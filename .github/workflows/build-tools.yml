name: forsitan-modulare tools build
on: [push, pull_request]

defaults:
  run:
    shell: bash

jobs:

  build-limen-cli:
    name: limen-cli ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: lin-x64
            os: ubuntu-latest
            artifact: limen-cli-lin-x64
          - platform: win-x64
            os: ubuntu-latest
            artifact: limen-cli-win-x64.exe
          - platform: mac
            os: macos-latest
            artifact: limen-cli-mac
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw cross-compiler
        if: matrix.platform == 'win-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build
        run: |
          cd tools/limen-cli
          case "${{ matrix.platform }}" in
            lin-x64)
              make
              mv limen-cli ${{ matrix.artifact }}
              ;;
            win-x64)
              make CC=x86_64-w64-mingw32-gcc EXE=.exe LDLIBS=-lws2_32
              mv limen-cli.exe ${{ matrix.artifact }}
              ;;
            mac)
              # universal binary (x86_64 + arm64)
              cc -Wall -O2 -arch x86_64 -arch arm64 -o ${{ matrix.artifact }} limen-cli.c
              ;;
          esac
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: tools/limen-cli/${{ matrix.artifact }}
          name: ${{ matrix.artifact }}

  publish:
    name: Publish tool binaries
    # attach binaries to the release for tags like v1.2.3 (the release itself
    # is created by the plugin build workflow; upload-release-action creates
    # it first if this job wins the race)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-limen-cli]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
      - name: Upload release assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: _artifacts/**/limen-*
          tag: ${{ github.ref }}
          file_glob: true
